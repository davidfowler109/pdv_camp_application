name: Deploy camp application to Azure staging

on:
  workflow_dispatch:
  push:
    branches:
      - staff-applications-and-ui-checkpoint

permissions:
  contents: read

concurrency:
  group: pdv-camp-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Ordinary pushes do not deploy. A deployment requires a manual
    # run or an explicit [deploy staging] marker in the commit message.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package application
        shell: bash
        run: |
          test -f .next/BUILD_ID
          files=(.next node_modules package.json package-lock.json next.config.ts)
          if [ -d public ]; then
            files+=(public)
          fi
          zip -qr "$RUNNER_TEMP/camp-staging.zip" "${files[@]}"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F863B312459540148887CC7139740112 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A79CB0B09A264C1B93B165342F669BF5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8F0AA032C8894C8F9FD3F78EECA4BC2C }}

      - name: Deploy staging application
        uses: azure/webapps-deploy@v3
        with:
          app-name: pdv-camp-staging
          slot-name: Production
          package: ${{ runner.temp }}/camp-staging.zip
